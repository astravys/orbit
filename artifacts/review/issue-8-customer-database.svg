<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="434" viewBox="0 0 780 434" role="img" aria-labelledby="orbit-title orbit-description">
<title id="orbit-title">Customer management database.</title>
<desc id="orbit-description">Customer management database.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
</defs>
<style>
.box{fill:#fff;stroke:#334155;stroke-width:1.5}.header{fill:#e2e8f0}.enum-header{fill:#ede9fe}.divider{stroke:#cbd5e1}.document-title{font:600 18px system-ui,sans-serif;fill:#0f172a}.title{font:600 15px system-ui,sans-serif;fill:#0f172a}.row{font:13px ui-monospace,monospace;fill:#1e293b}.row-pk{font-weight:700;fill:#7c2d12}.row-fk{font-weight:700;fill:#1d4ed8}.key-badge{font:700 10px system-ui,sans-serif}.documentation{font:12px system-ui,sans-serif;fill:#64748b}.relationship{fill:none;stroke:#334155;stroke-width:1.75}
</style>
<text class="document-title" x="40" y="30">Customer management database.</text>
<path id="relationship-0-user_orders" class="relationship" d="M 440 174 H 394 V 172 H 348" marker-end="url(#arrow)" /><title>user_orders</title>
<g id="table-users">
<rect class="box" x="40" y="94" width="300" height="120" rx="6" />
<path class="header" d="M 46 94 H 334 Q 340 94 340 100 V 158 H 40 V 100 Q 40 94 46 94 Z" />
<text class="title" x="52" y="118">users</text>
<text class="documentation" x="52" y="139">Application users.</text>
<line class="divider" x1="40" y1="158" x2="340" y2="158" /><text class="key-badge row row-pk" x="52" y="176">PK</text><text class="row row-pk" x="78" y="177">id: int [pk, auto_increment]</text>
<line class="divider" x1="40" y1="186" x2="340" y2="186" /><text class="row" x="52" y="205">email: string [unique, not_null]</text>
</g>
<g id="table-orders">
<rect class="box" x="440" y="94" width="300" height="122" rx="6" />
<path class="header" d="M 446 94 H 734 Q 740 94 740 100 V 132 H 440 V 100 Q 440 94 446 94 Z" />
<text class="title" x="452" y="118">orders</text>

<line class="divider" x1="440" y1="132" x2="740" y2="132" /><text class="key-badge row row-pk" x="452" y="150">PK</text><text class="row row-pk" x="478" y="151">id: int [pk, auto_increment]</text>
<line class="divider" x1="440" y1="160" x2="740" y2="160" /><text class="key-badge row row-fk" x="452" y="178">FK</text><text class="row row-fk" x="478" y="179">user_id: int [not_null]</text>
<line class="divider" x1="440" y1="188" x2="740" y2="188" /><text class="row" x="452" y="207">status: order_status</text>
</g>
<g id="enum-0-order_status">
<rect class="box" x="440" y="272" width="300" height="122" rx="6" />
<path class="enum-header" d="M 446 272 H 734 Q 740 272 740 278 V 310 H 440 V 278 Q 440 272 446 272 Z" />
<text class="title" x="452" y="296">order_status</text>

<line class="divider" x1="440" y1="310" x2="740" y2="310" /><text class="row" x="452" y="329">pending</text>
<line class="divider" x1="440" y1="338" x2="740" y2="338" /><text class="row" x="452" y="357">paid</text>
<line class="divider" x1="440" y1="366" x2="740" y2="366" /><text class="row" x="452" y="385">shipped</text>
</g>
</svg>
